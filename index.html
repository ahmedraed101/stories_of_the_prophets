      content="أتابع قصص الأنبياء والسيرة النبوية عبر تطبيق مركّز بلا تشتيت — ممتاز للتعلّم بهدوء وتتبّع التقدّم."
    />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="__CANONICAL_URL__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="قصص الأنبياء — بلا تشتيت" />
    <meta
      name="twitter:description"
      content="أتابع قصص الأنبياء والسيرة النبوية عبر تطبيق مركّز بلا تشتيت — ممتاز للتعلّم بهدوء وتتبّع التقدّم."
    />
    <meta name="twitter:image" content="__OG_IMAGE__" />
    <meta name="twitter:image:alt" content="قصص الأنبياء عليهم السلام" />
    <link rel="canonical" href="__CANONICAL_URL__" />
    <meta name="theme-color" content="#f4efe4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="قصص الأنبياء" />
    <script>
      try {
        const savedTheme = localStorage.getItem('stories-prophets:theme')
        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#0a1210' : '#f4efe4')
        const language =
          localStorage.getItem('stories-prophets:language') === 'en' ? 'en' : 'ar'
        document.documentElement.lang = language
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
          ? 'dark'
          : 'light'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>قصص الأنبياء</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
